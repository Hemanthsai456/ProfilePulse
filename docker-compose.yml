services:
  profilepulse:
    build: .
    container_name: profilepulse
    ports:
      - "8000:8000"
    environment:
      - PROFILEPULSE_ENV=development
      - PROFILEPULSE_SECRET=${PROFILEPULSE_SECRET:-local-dev-secret-key-32chars}
      - PROFILEPULSE_RATE_LIMIT=60
      - PROFILEPULSE_DB=/data/profilepulse.db
    volumes:
      - profilepulse_data:/data
    restart: unless-stopped

volumes:
  profilepulse_data:
